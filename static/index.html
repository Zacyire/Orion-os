<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orion OS</title>
  <meta name="description" content="Orion OS — games and media, delivered as a desktop in your browser." />
  <meta name="theme-color" content="#07080d" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />

  <!-- System layer: tokens first, then components. Edit tokens.css to re-theme. -->
  <link rel="stylesheet" href="css/system/tokens.css" />
  <link rel="stylesheet" href="css/system/base.css" />
  <link rel="stylesheet" href="css/system/boot.css" />
  <link rel="stylesheet" href="css/system/entry.css" />
  <link rel="stylesheet" href="css/system/desktop.css" />
  <link rel="stylesheet" href="css/system/taskbar.css" />
  <link rel="stylesheet" href="css/system/flyouts.css" />
  <link rel="stylesheet" href="css/system/windows.css" />
  <link rel="stylesheet" href="css/system/menus.css" />
  <link rel="stylesheet" href="css/system/widgets.css" />
  <!-- App layer -->
  <link rel="stylesheet" href="css/apps/common.css" />
  <link rel="stylesheet" href="css/apps/frame.css" />
  <link rel="stylesheet" href="css/apps/appstore.css" />
  <link rel="stylesheet" href="css/apps/notepad.css" />
  <link rel="stylesheet" href="css/apps/orion.css" />
  <link rel="stylesheet" href="css/apps/spiceify.css" />
  <link rel="stylesheet" href="css/apps/geforcenow.css" />
  <link rel="stylesheet" href="css/apps/vapor.css" />
  <link rel="stylesheet" href="css/apps/youtube.css" />

  <link rel="preload" href="media/wallpapers/aurora-ridge.jpg" as="image" />
  <script type="module" src="js/app.js"></script>
</head>
<body class="tb-bottom booting">
  <!-- Orion OS mark: defined once, used by the startup splash and the
       welcome/lock screens (<svg><use href="#orion-mark"/></svg>). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="orion-mark-orbit" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8a6bff"/><stop offset="1" stop-color="#4cc3ff"/>
      </linearGradient>
      <radialGradient id="orion-mark-glow">
        <stop offset="0" stop-color="#9fb8ff" stop-opacity=".55"/><stop offset="1" stop-color="#9fb8ff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <symbol id="orion-mark" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="20" fill="url(#orion-mark-glow)"/>
      <ellipse cx="32" cy="32" rx="28" ry="11" fill="none" stroke="url(#orion-mark-orbit)" stroke-width="2.4" transform="rotate(-24 32 32)"/>
      <circle cx="23.5" cy="36.5" r="2.9" fill="#fff"/>
      <circle cx="32" cy="32" r="3.4" fill="#fff"/>
      <circle cx="40.5" cy="27.5" r="2.9" fill="#fff"/>
      <circle cx="20" cy="15.5" r="2.3" fill="#ffc29a"/>
      <circle cx="45" cy="48.5" r="2.5" fill="#b9d2ff"/>
    </symbol>
  </svg>

  <!-- ─────────────── Startup splash (js/core/boot.js) ───────────────
       Static markup so it shows before any script runs. Progress and status
       reflect the real startup steps; nothing here is simulated. -->
  <section id="boot" aria-label="Orion OS is starting">
    <div class="boot-center">
      <svg class="boot-mark" aria-hidden="true"><use href="#orion-mark"/></svg>
      <h1 class="boot-title">Orion <span>OS</span></h1>
      <div class="boot-progress" role="progressbar" aria-label="Starting Orion OS" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <i id="boot-bar-fill"></i>
      </div>
      <p id="boot-status" aria-live="polite">Starting</p>
      <div id="boot-actions" hidden></div>
    </div>
    <button type="button" class="boot-skip" id="boot-skip">Skip <kbd>Esc</kbd></button>
  </section>

  <!-- ─────────────── Desktop ─────────────── -->
  <main id="shell" aria-label="Desktop">
    <!-- Live wallpaper: js/core/wallpaper.js mounts a <video autoplay loop muted>
         (or image / canvas fallback) here from /api/content/wallpapers. -->
    <div id="wallpaper" aria-hidden="true"></div>

    <div id="workarea">
      <div id="desktop" role="grid" aria-label="Desktop icons"></div>
      <div id="widgets" aria-label="Desktop widgets"></div>
      <div id="windows"></div>
      <div id="snap-preview"></div>
    </div>

    <nav id="taskbar" aria-label="Taskbar">
      <div class="tb-section tb-apps">
        <button class="tb-btn tb-start" id="start-btn" title="Start (Ctrl+Space)" aria-label="Start"></button>
        <div id="tb-items" class="tb-items"></div>
      </div>
      <div class="tb-section tb-tray" id="tray">
        <button class="tb-btn tray-cluster" id="tray-quick" title="Network and sound">
          <span id="tray-net"></span><span id="tray-vol"></span>
        </button>
        <button class="tb-btn tray-clock" id="tray-clock" title="Date and time">
          <span id="clock-time">--:--</span><span id="clock-date"></span>
        </button>
        <button class="tb-show-desktop" id="show-desktop" title="Show desktop" aria-label="Show desktop"></button>
      </div>
    </nav>

    <div id="start-menu" class="flyout" hidden></div>
    <div id="quick-settings" class="flyout" hidden></div>
    <div id="calendar-flyout" class="flyout" hidden></div>
    <div id="context-menu" role="menu" hidden></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="drag-layer"></div>
  </main>

  <section id="power-screen" hidden>
    <div class="power-spinner"></div>
    <p id="power-text">Shutting down</p>
  </section>
</body>
</html>
