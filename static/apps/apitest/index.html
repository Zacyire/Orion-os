<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LTF App API Test</title>
  <!-- First-party LTF app page. TEMPORARY developer test for the window.ltf API. -->
  <script src="/ltf-api.js"></script>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; box-sizing: border-box; padding: 28px 32px;
      font: 14px/1.5 "Segoe UI", system-ui, sans-serif; color: #eef0f5; background: #14161d; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .temp { color: #f5b942; font-size: 12px; margin: 0 0 20px; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0 0 24px;
      background: #1c1f29; border: 1px solid #2a2e3a; border-radius: 10px; padding: 16px; }
    dt { color: #8a90a2; } dd { margin: 0; font-family: ui-monospace, monospace; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    button { font: inherit; font-weight: 600; padding: 10px 18px; border: 0; border-radius: 8px;
      background: #4c8dff; color: #fff; cursor: pointer; }
    button.secondary { background: #2a2e3a; }
    button:hover { filter: brightness(1.1); }
    .unavailable { color: #ff5a67; }
  </style>
</head>
<body>
  <h1>LTF App API Test</h1>
  <p class="temp">Temporary developer test app — demonstrates <code>window.ltf</code>.</p>

  <dl>
    <dt>API</dt><dd id="api">checking…</dd>
    <dt>App ID</dt><dd id="id">—</dd>
    <dt>App Name</dt><dd id="name">—</dd>
    <dt>Version</dt><dd id="version">—</dd>
  </dl>

  <div class="row">
    <button id="open">Open Example URL</button>
    <button id="notify" class="secondary">Send Test Notification</button>
  </div>

  <script>
    var $ = function (id) { return document.getElementById(id); };
    if (!window.ltf) {
      $('api').textContent = 'window.ltf not available in this context';
      $('api').className = 'unavailable';
    } else {
      $('api').textContent = 'window.ltf available';
      window.ltf.ready().then(function (app) {
        $('id').textContent = app.id || '(unknown)';
        $('name').textContent = app.name || '(unknown)';
        $('version').textContent = app.version || '(none)';
      });
      $('open').onclick = function () { window.ltf.open('https://example.com/'); };
      $('notify').onclick = function () { window.ltf.notify('LTF App API Test', 'Hello from the test app at ' + new Date().toLocaleTimeString()); };
    }
  </script>
</body>
</html>
