<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Ninja with a low taper fade">
  <!-- Stylised "Ninja Low Taper Fade" mascot. Replace with assets/ninja-ltf.png for the real meme. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#2b86c5"/><stop offset="1" stop-color="#0b1026"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b24"/>
      <stop offset=".55" stop-color="#3a2e2a" stop-opacity=".85"/>
      <stop offset="1" stop-color="#e0a878" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd1ff"/><stop offset="1" stop-color="#1e5bff"/>
    </linearGradient>
    <linearGradient id="band" x1="0" x2="1">
      <stop offset="0" stop-color="#ff3cac"/><stop offset="1" stop-color="#ff7a18"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#fff" stroke-opacity=".15" stroke-width="3" stroke-dasharray="14 10"/>
  <!-- neck + shoulders -->
  <path d="M60 196c4-26 20-38 40-38s36 12 40 38z" fill="#101318"/>
  <rect x="86" y="140" width="28" height="24" rx="8" fill="#d99a6c"/>
  <!-- ears -->
  <ellipse cx="55" cy="104" rx="9" ry="14" fill="#d99a6c"/>
  <ellipse cx="145" cy="104" rx="9" ry="14" fill="#d99a6c"/>
  <!-- head -->
  <path d="M56 92c0-30 20-48 44-48s44 18 44 48v18c0 24-20 42-44 42s-44-18-44-42z" fill="#e8ad7d"/>
  <!-- the low taper fade -->
  <path d="M56 92c0-12 4-22 10-30l-2 52c-5-6-8-13-8-22z" fill="url(#fade)"/>
  <path d="M144 92c0-12-4-22-10-30l2 52c5-6 8-13 8-22z" fill="url(#fade)"/>
  <!-- signature blue top -->
  <path d="M58 80c-2-26 18-46 44-46 24 0 42 16 42 44-8-10-18-14-30-14-8-8-22-10-34-4-10 4-16 10-22 20z" fill="url(#hair)"/>
  <path d="M84 40c10-10 34-8 42 6" stroke="#bff0ff" stroke-width="4" stroke-linecap="round" fill="none" opacity=".7"/>
  <!-- headband -->
  <path d="M57 84c26-8 60-8 86 0v10c-26-8-60-8-86 0z" fill="url(#band)"/>
  <path d="M143 88l22-10-6 14 10 8-24-4z" fill="#ff5f6d"/>
  <!-- face -->
  <path d="M74 104q10-6 20 0" stroke="#1b1b24" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M106 104q10-6 20 0" stroke="#1b1b24" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="84" cy="112" r="4.5" fill="#1b1b24"/>
  <circle cx="116" cy="112" r="4.5" fill="#1b1b24"/>
  <path d="M98 116q2 10-4 14" stroke="#b67a52" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M84 134q16 12 32 0" stroke="#7a2e2e" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- LTF badge -->
  <g transform="translate(138 150)">
    <circle r="22" fill="#7c5cff" stroke="#fff" stroke-width="3"/>
    <text y="7" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="800" fill="#fff">LTF</text>
  </g>
</svg>
