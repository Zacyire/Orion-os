[package]
name = "ltf-os"
version = "0.1.0"
edition = "2021"
description = "LTF OS — a web desktop platform for games and media, with a Rust API layer"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "compression-gzip", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots", "gzip", "brotli", "stream", "json"] }
url = "2.5.8"
# Read-only host stats for /api/system/stats. Only the "system" feature: the
# user, disk, network and component APIs are not compiled in at all.
sysinfo = { version = "0.38", default-features = false, features = ["system"] }

[dev-dependencies]
# Route-level tests (already in the tree via axum).
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
