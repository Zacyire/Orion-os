# Orion OS — nginx reverse proxy (TLS termination + WebSocket).
#
# Alternative to Caddy. Include inside nginx's `http { }` block, e.g.
# /etc/nginx/conf.d/orion-os.conf. Replace orion.YOUR_DOMAIN and get a
# certificate first (e.g. `certbot certonly --nginx -d orion.YOUR_DOMAIN`).
# Orion OS listens on 127.0.0.1:8080 (LTF_MODE=production).
# See docs/deployment.md. tests/browser/deploy.browser.mjs runs
# this exact file (placeholders substituted) against a real server.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Plain HTTP only redirects to HTTPS.
server {
    listen 80;
    server_name orion.YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

# Unknown names (IP scans, other vhosts) never reach Orion OS: the TLS
# handshake is refused, and a request whose Host differs from the name it
# connected with lands here too and gets 421 Misdirected Request.
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 421;
}

server {
    listen 443 ssl http2;
    server_name orion.YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/orion.YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orion.YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Notepad uploads are capped at 5 MB per file by the server.
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Orion OS checks Host against LTF_ALLOWED_HOSTS and requires the /ws
        # Origin to equal https://<Host>. $http_host keeps the port when the
        # public URL has one; never hard-code or rewrite it.
        proxy_set_header Host $http_host;

        # Overwrite (not append to) any client-supplied value, so
        # LTF_TRUST_PROXY_HEADERS=1 sees the real client address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /ws (Origin and Cookie pass through unchanged).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
